---

- name: Install direnv in Ubuntu
  become: yes
  ansible.builtin.apt:
    name: direnv
  when: ansible_facts.distribution == "Ubuntu"

- name: Install direnv in MacOSX
  community.general.homebrew:
    name: direnv
  when: ansible_facts.distribution == "MacOSX"

- name: Set shell info
  ansible.builtin.set_fact:
    shell_info: "{{ ansible_facts.user_shell | shell_config }}"

- name: Setup direnv hook
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.user_dir }}/{{ shell_info.rc_file }}"
    regexp: "^eval \"$(direnv hook {{ shell_info.name }})\""
    line: "eval \"$(direnv hook {{ shell_info.name }})\""
