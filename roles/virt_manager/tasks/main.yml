---

- name: be sure virt-manager is installed
  become: yes
  apt: name=virt-manager,libvirt-bin,qemu-kvm
       state=latest

- name: install spice connection
  become: yes
  apt: name=qemu-kvm-spice,spice-client-gtk

- name: install spice-client
  become: yes
  apt: name=python-spice-client-gtk

- name: install ask-password
  become: yes
  apt: name=ssh-askpass,ssh-askpass-gnome
