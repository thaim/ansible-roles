---

- name: Install hashicorp official package
  ansible.builtin.include_tasks: official_package.yml
  when: terraform_setup_official_packages

- name: Check if tfenv installed
  ansible.builtin.command: which tfenv
  changed_when: false
  failed_when: false
  register: tfenv_install

- name: Install tfenv
  ansible.builtin.include_tasks: install_tfenv.yml
  when: tfenv_install.rc != 0

- name: Check if terraform-ls already installed
  ansible.builtin.command: which terraform-ls
  changed_when: false
  failed_when: false
  register: terraformls_install

- name: Install terraform language server
  ansible.builtin.include_tasks: install_terraformls_{{ ansible_facts.distribution }}.yml
  when: terraformls_install.rc != 0

- name: Check if tflint installed
  ansible.builtin.command: which tflint
  changed_when: false
  failed_when: false
  register: tflint_install

- name: Download tflint release archive
  vars:
    tflint_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  ansible.builtin.get_url:
    url: https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_{{ tflint_arch }}.zip
    checksum: sha256:https://github.com/terraform-linters/tflint/releases/latest/download/checksums.txt
    dest: /tmp/tflint_linux.zip
    mode: '0644'
  when: tflint_install.rc != 0

- name: Install tflint
  become: yes
  ansible.builtin.unarchive:
    src: /tmp/tflint_linux.zip
    dest: /usr/local/bin
    include:
      - tflint
    mode: '0755'
    remote_src: true
  when: tflint_install.rc != 0
