---

- name: Check nodenv is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.nodenv/bin/nodenv"
  register: nodenv_stat

- name: Setup nodenv
  ansible.builtin.include_tasks: install_{{ ansible_facts.distribution }}.yml
  when: not nodenv_stat.stat.exists

- name: Setup node.js
  ansible.builtin.include_tasks: version.yml
