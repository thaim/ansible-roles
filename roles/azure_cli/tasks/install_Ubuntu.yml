---

- name: install dendencies
  become: yes
  apt:
    pkg:
      - apt-transport-https
      - lsb-release
      - software-properties-common
      - dirmngr

- name: add source list
  become: yes
  template:
    src: azure-cli.list.j2
    dest: /etc/apt/sources.list.d/azure-cli.list

- name: add gpg key
  become: yes
  apt_key:
    url: https://packages.microsoft.com/keys/microsoft.asc

- name: install azure-cli package
  become: yes
  apt:
    name: azure-cli
    update_cache: yes
