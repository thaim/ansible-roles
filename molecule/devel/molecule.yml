---
# playbook-workstation.yml を開発サーバー (devel 配下の全 group) として Ubuntu コンテナ上で実行する E2E テスト
platforms:
  - name: ubuntu2404
    image: ubuntu:24.04
    command: sleep infinity
    pre_build_image: true
    env:
      USER: tester
      SHELL: /bin/bash
    # 開発用途の play をすべて実行するため、devel 配下の全 group に所属させる
    groups:
      - devel
      - webapp
      - devos
      - terraform
provisioner:
  env:
    # コンテナでは動かせない role (Docker in Docker が必要) を除外する
    # options.skip-tags で指定すると molecule が付与する skip-tags (molecule-idempotence-notest など) を上書きしてしまうため、
    # CLI の --skip-tags に追加される環境変数で指定する
    ANSIBLE_SKIP_TAGS: docker
