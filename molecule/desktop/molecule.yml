---
# playbook-workstation.yml を desktop group のホストとして Ubuntu コンテナ上で実行する E2E テスト
platforms:
  - name: ubuntu2404
    image: ubuntu:24.04
    command: sleep infinity
    pre_build_image: true
    env:
      USER: tester
      SHELL: /bin/bash
    groups:
      - desktop
provisioner:
  env:
    # コンテナでは動かせない role (NFS マウント / systemd / GUI アプリ) を除外する
    # options.skip-tags で指定すると molecule が付与する skip-tags (molecule-idempotence-notest など) を上書きしてしまうため、
    # CLI の --skip-tags に追加される環境変数で指定する
    ANSIBLE_SKIP_TAGS: homenas_client,fluentd,dropbox
