---
# playbook-desktop.yml を Ubuntu コンテナ上で実行する E2E テスト
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: desktop-ubuntu2404
    image: ubuntu:24.04
    command: sleep infinity
    pre_build_image: true
    # docker exec では USER が設定されないため、デスクトップ環境と同様に設定する
    env:
      USER: tester

provisioner:
  name: ansible
  inventory:
    host_vars:
      desktop-ubuntu2404:
        ansible_user: tester
  options:
    # コンテナでは動かせない role (NFS マウント / systemd / GUI アプリ) を除外する
    skip-tags: homenas_client,fluentd,dropbox

scenario:
  # changed_when: true のタスクがあり冪等にならないため、idempotence は実行しない
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - destroy
