[tool.poetry]
name = "ansible-roles"
version = "0.1.0"
description = "my ansible playbooks"
authors = ["thaim <thaim24@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11 <3.14"
ansible-core = "~2.19.0"
jmespath = "^1.0.1"

[tool.poetry.group.dev.dependencies]
ansible-lint = { version = "^26.9.0", markers = "platform_system != 'Windows'" }
molecule = "^26.9.0"
molecule-plugins = {version = "^26.9.28", extras = ["docker"]}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
