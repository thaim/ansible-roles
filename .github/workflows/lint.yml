name: Ansible Lint

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint Ansible Playbook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-python の cache: poetry が poetry コマンドを参照するため、先にインストールする
      - run: pipx install poetry==2.4.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: poetry

      - run: poetry sync --no-root

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - run: poetry run ansible-galaxy collection install -r requirements.yml

      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.2

      # reviewdog/action-ansiblelint は deprecated な `ansible-lint -p` を固定で使い、pipefail もないため直接実行する
      # pipefail で ansible-lint 自体の異常終了 (引数エラー等) でも step を失敗させる
      - name: run ansible-lint on reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.github_token }}
        run: |
          set -o pipefail
          poetry run ansible-lint --format=pep8 \
            | reviewdog -efm="%f:%l: %m" \
                -name="ansible-lint" \
                -reporter=github-pr-check \
                -level=error \
                -filter-mode=nofilter \
                -fail-level=error
