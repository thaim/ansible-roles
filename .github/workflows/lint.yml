name: Ansible Lint

on: pull_request

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint Ansible Playbook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # setup-python の cache: poetry が poetry コマンドを参照するため、先にインストールする
      - run: pipx install poetry==2.4.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
          cache: poetry

      # poetry.lock の ansible-core / ansible-lint で lint する。action に任せると action が ansible-core を固定せず最新版を入れ、ansible-lint と非互換になるため
      # setup-python の cache: poetry が作る仮想環境を PATH に追加し、action 内の pip3 / ansible-lint がこの環境を参照するようにする
      - name: install dependencies from poetry.lock
        id: deps
        run: |
          poetry sync --no-root
          echo "$(poetry env info --path)/bin" >> "$GITHUB_PATH"
          # echo "...$(cmd)" の形では cmd の失敗で step を落とせないため、変数に代入してから出力する
          version=$(poetry run python -c 'from importlib.metadata import version; print(version("ansible-lint"))')
          echo "ansiblelint_version=${version}" >> "$GITHUB_OUTPUT"

      # action 内の pip install が何もしないよう、インストール済みと同じバージョンを渡す
      - name: run ansible-lint on reviewdog
        uses: reviewdog/action-ansiblelint@57a0721547b93e9925bd05bf20ea17810bb3cff7 # v1.20.0
        with:
          github_token: ${{ secrets.github_token }}
          ansiblelint_version: ${{ steps.deps.outputs.ansiblelint_version }}
          fail_level: error
          filter_mode: nofilter
