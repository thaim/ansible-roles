name: Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  security:
    permissions:
      contents: read
      pull-requests: write
    uses: thaim/actions/.github/workflows/reusable-gha-security.yml@4291f7f54c1f7b0ebd7e7dc6e86dae3e3163b537 # v3.0.0
