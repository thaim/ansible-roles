name: Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  security:
    permissions:
      contents: read
      pull-requests: write
    uses: thaim/actions/.github/workflows/reusable-gha-security.yml@cdcff030309dd82f6ad71e8ca8bd2e98988792a3 # v3.1.0
