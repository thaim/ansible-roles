name: Molecule E2E

on:
  push:
    branches: [main]
    paths:
      - "playbook-*.yml"
      - "roles/**"
      - "filter_plugins/**"
      - "molecule/**"
      - ".config/molecule/**"
      - "requirements.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/molecule-e2e.yml"
  # PR に "/e2e" とコメントすると、PR の head に対して E2E を実行し結果をコメントする
  issue_comment:
    types: [created]
  workflow_dispatch:

# /e2e 以外のコメントでも run は作られるため、それらは run ごとの group にして実行中の E2E を止めないようにする
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}${{
    (github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/e2e'))
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 実行対象のコミットを決める。コメント起動の場合は PR へのコメントかつ権限のあるユーザーのみ受け付ける
  prepare:
    if: >-
      github.event_name != 'issue_comment' || (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/e2e') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      # コメントを受け付けたことが分かるよう、起動したコメントにリアクションを付ける
      - name: react to the comment
        if: github.event_name == 'issue_comment'
        # リアクションに失敗しても E2E は実行する
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='+1' --silent

      - name: determine target commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          else
            sha="$GITHUB_SHA"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "target commit: ${sha}"

  e2e:
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Molecule E2E (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        # playbook ごとの scenario
        scenario: [desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      # setup-python の cache: poetry が poetry コマンドを参照するため、先にインストールする
      - run: pipx install poetry==2.4.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
          cache: poetry

      - run: poetry sync --no-root

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - run: poetry run ansible-galaxy collection install -r requirements.yml

      - run: poetry run molecule test -s "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}

  # コメント起動の場合のみ、結果を PR にコメントする
  report:
    needs: [prepare, e2e]
    if: always() && github.event_name == 'issue_comment' && needs.prepare.result == 'success'
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: comment result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ needs.e2e.result }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            success) mark=":white_check_mark:" ;;
            *) mark=":x:" ;;
          esac
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "${mark} Molecule E2E: **${RESULT}** (\`${SHA:0:7}\`) ${RUN_URL}"
