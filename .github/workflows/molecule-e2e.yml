name: Molecule E2E

on:
  push:
    branches: [main]
    paths:
      - "playbook-*.yml"
      - "roles/**"
      - "filter_plugins/**"
      - "molecule/**"
      - ".config/molecule/**"
      - "requirements.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/molecule-e2e.yml"
  # PR ブランチを指定して実行する。PR の "/e2e" コメント (e2e-command.yml) からも起動される
  workflow_dispatch:
    inputs:
      pr_number:
        description: "結果をコメントする PR の番号 (省略時はコメントしない)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Molecule E2E (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        # host group の組み合わせごとの scenario (docs/inventory.md 参照)
        scenario: [desktop, devel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-python の cache: poetry が poetry コマンドを参照するため、先にインストールする
      - run: pipx install poetry==2.4.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: poetry

      - run: poetry sync --no-root

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - run: poetry run ansible-galaxy collection install -r requirements.yml

      - run: poetry run molecule test -s "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}

  # PR 番号が指定された場合のみ、結果を PR にコメントする
  report:
    needs: e2e
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: comment result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RESULT: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            success) mark=":white_check_mark:" ;;
            *) mark=":x:" ;;
          esac
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "${mark} Molecule E2E: **${RESULT}** (\`${GITHUB_SHA:0:7}\`) ${RUN_URL}"
